/* Native coordinate-aware Leonida map */
.mapstage{height:min(76vh,820px);min-height:520px;background:#101821;overflow:hidden;touch-action:none;position:relative}
#leonidaMap{display:block;width:100%;height:100%;background:#111d25;cursor:grab;user-select:none}
#leonidaMap.dragging{cursor:grabbing}
.map-land{pointer-events:none}
.map-point{cursor:pointer;stroke:#fff;stroke-width:42;vector-effect:non-scaling-stroke;paint-order:stroke;transition:opacity .12s}
.map-point:hover{stroke:var(--gold);stroke-width:58}
.map-point.business{fill:#e9c27f}.map-point.transport{fill:#80c9dc}.map-point.nature{fill:#75bd91}.map-point.landmark{fill:#f07ba3}.map-point.region{fill:#f4e5bd;stroke:#312738;stroke-width:70}
.map-point.personal{fill:#f4c95d}.map-point.has-mission{stroke:#f7d7e4;stroke-width:95}
.map-cluster{fill:#1a2430;stroke:#f4d2df;stroke-width:65;cursor:pointer}.map-cluster-label{fill:#fff;font:700 230px Inter,sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.map-tooltip{position:absolute;left:12px;top:12px;background:#111722eF;border:1px solid #5b5361;border-radius:10px;padding:9px 12px;font-size:9px;color:#f7edf2;pointer-events:none;max-width:260px}
.map-key{display:flex;gap:10px;flex-wrap:wrap;color:#c8c0c7;font-size:9px;margin:9px 0}.map-key span{display:flex;align-items:center;gap:5px}.map-key i{width:8px;height:8px;border-radius:50%;display:inline-block}
.map-detail-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.map-search-results{max-height:210px;overflow:auto;display:grid;gap:4px;margin-top:8px}
.map-search-result{background:#151923;border:1px solid #343746;border-radius:8px;padding:8px;text-align:left;color:#eee;font-size:9px}
.map-search-result:hover{border-color:var(--pink)}
.map-data-status{font-size:9px;color:#a9e1d7;padding:8px 10px;background:#17282b;border-radius:8px;margin:8px 0}
.map-data-status.error{color:#f0c2bd;background:#322123}
.mission-link{font-size:9px;color:#f6c8db;margin-top:5px}
.mission-place{color:#9ee2d8;font-size:9px}
.evidence-unknown{color:#efc58a}


/* Refined map symbols + cursor-following information card */
.map-point{stroke:#f7f2ee;stroke-width:2.4;vector-effect:non-scaling-stroke;paint-order:stroke;filter:drop-shadow(0 2px 3px #0009);transition:filter .12s,opacity .12s}
.map-point:hover,.map-point:focus{stroke:#fff;stroke-width:3.4;filter:drop-shadow(0 0 7px #fff9);outline:none}
.map-point.business{fill:#e9b96f}.map-point.transport{fill:#70c6d8}.map-point.nature{fill:#77c69a}.map-point.landmark{fill:#ec789e}.map-point.region{fill:#f3e6c7;stroke:#4b3949;stroke-width:2.5}.map-point.personal{fill:#f3ca60}.map-point.has-mission{stroke:#fff;stroke-width:4}
.map-point-glyph{fill:#18202a;font:800 9px Inter,sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.map-tooltip{position:absolute;z-index:8;left:0;top:0;display:none;max-width:285px;min-width:190px;padding:11px 12px;background:#111722f5;border:1px solid #746477;border-radius:11px;box-shadow:0 12px 35px #0009;color:#f8f1f5;pointer-events:none;transform:translate(14px,14px);font-size:10px;line-height:1.45}
.map-tooltip strong{display:block;font-size:12px;margin-bottom:4px}.map-tooltip .tipmeta{color:#b9b1bd;font-size:9px;margin-top:4px}.map-tooltip .tiptags{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}.map-tooltip .tiptags span{background:#2c2937;border:1px solid #494252;border-radius:99px;padding:2px 6px;font-size:8px}
.story-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.story-entry{display:flex;gap:9px;align-items:flex-start;padding:10px;background:#151923;border:1px solid #393b49;border-radius:10px}.story-entry input{accent-color:var(--pink);margin-top:3px}.story-entry .entrybody{flex:1;min-width:0}.story-entry b{font-size:10px}.story-entry small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.admin-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid #8c6380;background:#39283a;color:#ffd5e6;border-radius:99px;padding:4px 8px;font-size:8px;font-weight:900;letter-spacing:.08em}
@media(max-width:680px){.story-grid{grid-template-columns:1fr}.map-tooltip{max-width:230px;min-width:160px}}

<body><div id="root"></div>
<script>
"use strict";
const MAP_IMAGE="https://raw.githubusercontent.com/navanem/gta6-leonida-atlas/83cf9870aa64a2b1b66939e2a49aeb36ac3a4158/public/assets/gta6-leonida-atlas/basemap.svg";
const MAP_DATA_URL="https://raw.githubusercontent.com/navanem/gta6-leonida-atlas/83cf9870aa64a2b1b66939e2a49aeb36ac3a4158/public/assets/street-leonida/maps/gtadb-landmarks-7c3f8c2.json";
const MAP_REVISION="7c3f8c295d64254e6b6d269b77c6f84fc4339f9c";
const MAP_BOUNDS={x:-32000,y:-24000,w:40000,h:40000};
const MAP_START={x:-22000,y:-22016,w:30000,h:38016};
const MAP_PROJECT="https://github.com/navanem/gta6-leonida-atlas";

const STORE="raiderBuddy.v2";
const nav=[["Overview","▦"],["Interactive Map","⌖"],["Discover","◇"],["My Progress","✓"],["Story Hub","◈"],["Entertainment","▶"],["AI Companion","✧"],["Friends","◎"],["Raider+","✦"],["Settings","⚙"]];
const seedPlaces=[
{id:"region-vc",name:"Vice City",region:"Vice City",category:"Region",evidence:"Official",x:66,y:42,notes:"Major city setting. Exact map placement is approximate community cartography."},
{id:"region-keys",name:"Leonida Keys",region:"Leonida",category:"Region",evidence:"Official",x:73,y:81,notes:"Region name; marker position is illustrative."},
{id:"region-grass",name:"Grassrivers",region:"Leonida",category:"Region",evidence:"Official",x:44,y:58,notes:"Wetland region name; marker position is illustrative."},
{id:"region-gellhorn",name:"Port Gellhorn",region:"Leonida",category:"Region",evidence:"Official",x:25,y:46,notes:"Region name; marker position is illustrative."},
{id:"region-ambrosia",name:"Ambrosia",region:"Leonida",category:"Region",evidence:"Official",x:39,y:35,notes:"Region name; marker position is illustrative."},
{id:"region-kalaga",name:"Mount Kalaga National Park",region:"Leonida",category:"Region",evidence:"Official",x:47,y:18,notes:"Region name; marker position is illustrative."}
];
const seedTasks=[
{id:"m1",title:"Add your first verified main story mission",category:"Story",done:false},
{id:"m2",title:"Record a side activity you discover",category:"Activities",done:false},
{id:"m3",title:"Start a collectibles checklist",category:"Collectibles",done:false},
{id:"m4",title:"Save a location and add a source note",category:"Exploration",done:false}
];
function read(){try{let d=JSON.parse(localStorage.getItem(STORE)||"{}");if(!d.tasks){const legacy=JSON.parse(localStorage.getItem("rb_tasks")||"null");if(Array.isArray(legacy))d.tasks=legacy.map(t=>({id:String(t.id||Date.now()+Math.random()),title:t.title||"Imported objective",category:t.category||"Personal",done:!!t.done}))}if(!d.places){const legacy=JSON.parse(localStorage.getItem("rb_places")||"null");if(Array.isArray(legacy))d.places=legacy.map((p,i)=>({id:String(p.id||"legacy"+i),name:p.name||"Saved location",region:p.area||"Leonida",category:p.type||"Personal",evidence:"Legacy personal note",x:12+(i%5)*18,y:20+(i%4)*17,notes:p.description||"Imported from previous Raider Buddy version."}))}return {tasks:Array.isArray(d.tasks)?d.tasks:seedTasks.map(x=>({...x})),places:Array.isArray(d.places)?d.places:seedPlaces.map(x=>({...x})),notes:Array.isArray(d.notes)?d.notes:[],friends:Array.isArray(d.friends)?d.friends:[],messages:Array.isArray(d.messages)?d.messages:[],easterEggs:Array.isArray(d.easterEggs)?d.easterEggs:[],storyChapters:Array.isArray(d.storyChapters)?d.storyChapters:[],settings:d.settings||{spoilers:"ask",mapLayers:{},subscription:"premium",admin:true},mapView:d.mapView||{zoom:1,x:0,y:0}}}catch{return {tasks:seedTasks.map(x=>({...x})),places:seedPlaces.map(x=>({...x})),notes:[],friends:[],messages:[],easterEggs:[],storyChapters:[],settings:{spoilers:"ask",mapLayers:{},subscription:"premium",admin:true},mapView:{zoom:1,x:0,y:0}}}}
let db=read();db.settings.admin=true;db.settings.subscription="premium";let page="Overview",mapQuery="",discoverQuery="",discFilter="All",taskFilter="All",selectedPlace=null,mapZoom=db.mapView.zoom||1,mapPan={x:0,y:0};
let communityPlaces=[],catalogueStatus="loading",catalogueError="",showUnknown=false,showMissionLinksOnly=false;
let mapView={...(db.mapView?.view||MAP_START)},mapFilter="all",mapClusterIndex=[];

let layers={...layerDefaults,...(db.settings.mapLayers||{})};

function persist(){db.settings.mapLayers=layers;db.mapView={zoom:mapZoom,x:mapPan.x,y:mapPan.y,view:mapView};try{localStorage.setItem(STORE,JSON.stringify(db))}catch(e){console.warn("Could not save local data",e)}}
function navButton(n){return `<button class="${page===n[0]?"active":""}" onclick="go('${n[0]}')"><span class="ico">${n[1]}</span>${n[0]}</button>`}

function sourceCategory(tags=[]){
 const t=tags.map(x=>String(x).toLowerCase());
 if(t.some(x=>["natural","agriculture"].includes(x)))return "nature";
 if(t.some(x=>["transportation","infrastructure","infr"].includes(x)))return "transport";
 if(t.some(x=>["hotel","restaurant","retail","service","office","industrial"].includes(x)))return "business";
 return "landmark";
}
function sourcePlace(p){
 const coords=Array.isArray(p.inGameCoordinates)&&p.inGameCoordinates.length===2&&p.inGameCoordinates.every(Number.isFinite);
 const tags=Array.isArray(p.tags)?p.tags:[];
 const address=String(p.inGameAddress||"").trim();
 return {id:p.id,title:address||("Unnamed community record "+p.id),name:address||("Unnamed community record "+p.id),
  category:sourceCategory(tags),tags,region:address.includes(",")?address.split(",").slice(1).join(",").trim():"Leonida",
  gx:coords?p.inGameCoordinates[0]:null,gy:coords?p.inGameCoordinates[1]:null,
  x:coords?p.inGameCoordinates[0]*2:null,y:coords?-p.inGameCoordinates[1]*2:null,
  confidence:p.confidence||"UNKNOWN",placement:p.evidence?.placement||"APPROXIMATE",
  nameEvidence:p.evidence?.name||"UNKNOWN",unconfirmed:tags.some(t=>["unconfirmed","uncomfirmed","may-not-exist","maynot exist","todo","cancelled","demolished"].includes(String(t).toLowerCase())),
  source:"GTADB / Map GTA community catalogue",license:"CC BY 4.0",personal:false};
}
function regionPlaces(){
 const anchors=[["Vice City","L208"],["Leonida Keys","L544"],["Grassrivers","L1458"],["Port Gellhorn","L310"],["Ambrosia","L399"],["Mount Kalaga National Park","L530"]];
 return anchors.map(([title,id])=>{const p=communityPlaces.find(x=>x.id===id);return p?{...p,id:"region-"+id,title,name:title,category:"region",confidence:"SUPPORTED",placement:"APPROXIMATE",personal:false,region:title,description:"Officially named region. Marker aliases a reviewed GTADB community landmark; regional boundary and exact centre are not surveyed."}:null}).filter(Boolean);
}
function allMapPlaces(){return [...regionPlaces(),...communityPlaces,...db.places.filter(p=>p.personal||String(p.id).startsWith("p")).map(p=>{
 if(Number.isFinite(p.gx)&&Number.isFinite(p.gy))return {...p,x:p.gx*2,y:-p.gy*2,category:"personal",personal:true};
 const px=Number(p.x),py=Number(p.y);return {...p,x:MAP_BOUNDS.x+(px/100)*MAP_BOUNDS.w,y:MAP_BOUNDS.y+(py/100)*MAP_BOUNDS.h,category:"personal",personal:true};
 })];}
async function loadCommunityCatalogue(){
 const valid=d=>!!d&&Array.isArray(d.landmarks)&&d.landmarks.length===2198&&d.landmarks.filter(p=>Array.isArray(p.inGameCoordinates)&&p.inGameCoordinates.length===2).length===2091&&d.landmarks.filter(p=>p.confidence==="SUPPORTED").length===540&&d.source?.revision===MAP_REVISION;
 try{
  let d;
  try{const r=await fetch(MAP_DATA_URL,{cache:"force-cache"});if(!r.ok)throw new Error("Catalogue request failed ("+r.status+").");d=await r.json();if(!valid(d))throw new Error("Catalogue validation failed: unexpected source revision or record count.");try{localStorage.setItem("rb.communityCatalogue.v1",JSON.stringify(d));}catch(e){console.warn("Local catalogue cache unavailable",e)}}
  catch(networkError){const cached=localStorage.getItem("rb.communityCatalogue.v1");if(!cached)throw networkError;d=JSON.parse(cached);if(!valid(d))throw networkError;catalogueError="Using the previously cached community catalogue because the live source could not be reached.";}
  communityPlaces=d.landmarks.map(sourcePlace);catalogueStatus="ready";if(!catalogueError)catalogueError="";
  if(page==="Interactive Map"||page==="My Progress")render();
 }catch(e){catalogueStatus="error";catalogueError=e?.message||"Could not load community map data.";if(page==="Interactive Map"||page==="My Progress")render();}
}
function mapEvidenceLabel(p){if(p.personal)return "PERSONAL";if(p.id.startsWith("region-"))return "OFFICIAL NAME · APPROXIMATE PLACEMENT";return (p.confidence==="SUPPORTED"?"SUPPORTED COMMUNITY ENTRY":"UNKNOWN / UNVERIFIED")+" · APPROXIMATE";}
function mapPointColor(cat){return ({business:"business",transport:"transport",nature:"nature",landmark:"landmark",region:"region",personal:"personal"})[cat]||"landmark";}
function currentMapPlaces(){
 const q=mapQuery.trim().toLowerCase();
 return allMapPlaces().filter(p=>{
  if(!p.personal&&!p.id.startsWith("region-")&&(p.confidence!=="SUPPORTED"||p.unconfirmed)&&!showUnknown)return false;
  if(!p.personal&&!p.id.startsWith("region-")&&p.confidence==="UNKNOWN"&&!showUnknown)return false;
  if(!p.personal&&!p.id.startsWith("region-")&&!p.x&&p.x!==0)return false;
  if(!layers[p.category])return false;
  if(showMissionLinksOnly&&!db.tasks.some(t=>t.placeId===p.id))return false;
  if(mapFilter!=="all"&&p.category!==mapFilter)return false;
  if(q&&!(`${p.title} ${p.region} ${(p.tags||[]).join(" ")} ${p.id}`.toLowerCase().includes(q)))return false;
  return true;
 });
}
function svgPoint(svg,clientX,clientY){const pt=svg.createSVGPoint();pt.x=clientX;pt.y=clientY;return pt.matrixTransform(svg.getScreenCTM().inverse());}
function setMapView(v){mapView={...v};const svg=document.getElementById("leonidaMap");if(svg){svg.setAttribute("viewBox",`${v.x} ${v.y} ${v.w} ${v.h}`);drawMapMarkers()} }
function drawMapMarkers(){
 const svg=document.getElementById("leonidaMap"),group=document.getElementById("mapMarkers"),stage=document.getElementById("mapstage");if(!svg||!group||!stage)return;
 const places=currentMapPlaces().filter(p=>Number.isFinite(p.x)&&Number.isFinite(p.y));
 const screen=places.map(p=>{const pt=svg.createSVGPoint();pt.x=p.x;pt.y=p.y;const q=pt.matrixTransform(svg.getScreenCTM());return {...p,sx:q.x,sy:q.y};}).filter(p=>{const r=stage.getBoundingClientRect();return p.sx>=r.left-40&&p.sx<=r.right+40&&p.sy>=r.top-40&&p.sy<=r.bottom+40;});
 mapClusterIndex=[];
 const cell=48,clusters=new Map();
 for(const p of screen){const k=Math.floor(p.sx/cell)+":"+Math.floor(p.sy/cell);if(!clusters.has(k))clusters.set(k,[]);clusters.get(k).push(p);}
 let markup="",clusterId=0;
 for(const groupPlaces of clusters.values()){
  if(groupPlaces.length>1&&mapView.w>6500){
   const x=groupPlaces.reduce((a,p)=>a+p.x,0)/groupPlaces.length,y=groupPlaces.reduce((a,p)=>a+p.y,0)/groupPlaces.length;
   mapClusterIndex[clusterId]=groupPlaces;
   markup+=`<g data-cluster="${clusterId}" tabindex="0" role="button" aria-label="Zoom to ${groupPlaces.length} places"><circle class="map-cluster" cx="${x}" cy="${y}" r="${Math.max(120,Math.min(320,mapView.w/90))}"/><text class="map-cluster-label" x="${x}" y="${y}">${groupPlaces.length}</text></g>`;
   clusterId++;
  }else for(const p of groupPlaces){
   const linked=db.tasks.filter(t=>t.placeId===p.id).length;
   const cls=mapPointColor(p.category)+(p.personal?" personal":"")+(linked?" has-mission":"");
   const r=Math.max(95,Math.min(190,mapView.w/230)),glyph=({business:"B",transport:"T",nature:"N",landmark:"L",region:"R",personal:"★"})[p.category]||"•";
   markup+=`<g class="map-hit" data-place="${esc(p.id)}" tabindex="0" role="button" aria-label="${esc(p.title)}"><path class="map-point ${cls}" d="M ${p.x} ${p.y-r} L ${p.x+r*.82} ${p.y-r*.18} L ${p.x+r*.58} ${p.y+r*.68} L ${p.x} ${p.y+r} L ${p.x-r*.58} ${p.y+r*.68} L ${p.x-r*.82} ${p.y-r*.18} Z"/><text class="map-point-glyph" x="${p.x}" y="${p.y+2}" style="font-size:${r*.72}px">${glyph}</text></g>`;
  }
 }
 group.innerHTML=markup;
}
function mapSelectSearchResults(){
 const box=document.getElementById("mapSearchResults");if(!box)return;
 const q=mapQuery.trim().toLowerCase();if(!q){box.innerHTML="";return}
 const matches=allMapPlaces().filter(p=>`${p.title} ${p.region} ${(p.tags||[]).join(" ")} ${p.id}`.toLowerCase().includes(q)).slice(0,12);
 box.innerHTML=matches.map(p=>`<button class="map-search-result" onclick="selectMapPlace('${esc(p.id)}')"><b>${esc(p.title)}</b><div class="meta">${esc(p.id)} · ${esc(p.category)} · ${p.x===null?"NO SOURCE POSITION":mapEvidenceLabel(p)}</div></button>`).join("")||'<div class="meta">No matches.</div>';
}
function mapSelectDetail(id){
 const p=allMapPlaces().find(x=>x.id===id);if(!p)return;

 d.innerHTML=`<h3>${esc(p.title)}</h3><div class="meta">${esc(p.id)} · ${esc(p.category)} · ${esc(p.region||"Leonida")}</div><p>${esc(p.description||p.notes||"No additional description in source catalogue.")}</p><div class="pill">${esc(mapEvidenceLabel(p))}</div><p class="meta">${p.gx!==null&&p.gy!==null?`GTADB coordinates: ${p.gx.toFixed(2)}, ${p.gy.toFixed(2)}`:"No coordinates supplied in source; this record cannot be plotted."}</p><p class="meta">Source: GTADB / Map GTA · CC BY 4.0</p>
 <div class="map-detail-actions">${button("＋ Link objective",`createTaskAtPlace('${p.id}')`,"sm primary")}${p.x!==null?button("Centre map",`centreMapOn('${p.id}')`,"sm subtle"):""}</div>

}
function selectMapPlace(id){const p=allMapPlaces().find(x=>x.id===id);if(!p)return;if(p.x!==null&&p.y!==null)centreMapOn(id);mapSelectDetail(id);mapQuery=p.title;const input=document.getElementById("mapSearch");if(input)input.value=mapQuery;mapSelectSearchResults();}
function centreMapOn(id){const p=allMapPlaces().find(x=>x.id===id);if(!p||p.x===null||p.y===null)return;const w=Math.min(mapView.w,5000),h=w*(mapView.h/mapView.w);setMapView({x:p.x-w/2,y:p.y-h/2,w,h});}
function createTaskAtPlace(id){const p=allMapPlaces().find(x=>x.id===id);if(!p)return;const title=prompt("Objective name for "+p.title+":");if(!title?.trim())return;db.tasks.unshift({id:"t"+Date.now(),title:title.trim(),category:"Exploration",done:false,placeId:id});persist();drawMapMarkers();mapSelectDetail(id);if(page!=="Interactive Map")render();}
function mapZoomAt(clientX,clientY,factor){const svg=document.getElementById("leonidaMap");if(!svg)return;const p=svgPoint(svg,clientX,clientY),w=Math.max(500,Math.min(40000,mapView.w*factor)),h=w*(mapView.h/mapView.w);const rx=(p.x-mapView.x)/mapView.w,ry=(p.y-mapView.y)/mapView.h;setMapView({x:p.x-rx*w,y:p.y-ry*h,w,h});}
function showMapTooltip(id,clientX,clientY){
 const tip=document.getElementById("mapHoverTip"),stage=document.getElementById("mapstage"),p=allMapPlaces().find(x=>x.id===id);if(!tip||!stage||!p)return;
 const linked=db.tasks.filter(t=>t.placeId===p.id),tags=(p.tags||[]).slice(0,3);
 tip.innerHTML=`<strong>${esc(p.title)}</strong><div>${esc(p.category.toUpperCase())} · ${esc(p.region||"Leonida")}</div><div class="tipmeta">${esc(mapEvidenceLabel(p))}</div>${p.description||p.notes?`<div class="tipmeta">${esc((p.description||p.notes).slice(0,135))}${(p.description||p.notes).length>135?"…":""}</div>`:""}<div class="tiptags"><span>${esc(p.id)}</span>${linked.length?`<span>${linked.length} linked objective${linked.length===1?"":"s"}</span>`:""}${tags.map(t=>`<span>${esc(t)}</span>`).join("")}</div>`;
 const r=stage.getBoundingClientRect();tip.style.display="block";const w=tip.offsetWidth,h=tip.offsetHeight;let x=clientX-r.left,y=clientY-r.top;if(x+w+22>r.width)x=x-w-18;if(y+h+22>r.height)y=y-h-18;tip.style.left=Math.max(6,x)+"px";tip.style.top=Math.max(6,y)+"px";
}
function hideMapTooltip(){const tip=document.getElementById("mapHoverTip");if(tip)tip.style.display="none"}
function attachNativeMap(){
 const stage=document.getElementById("mapstage"),svg=document.getElementById("leonidaMap");if(!stage||!svg)return;
 drawMapMarkers();mapSelectSearchResults();
 stage.addEventListener("pointermove",e=>{const hit=e.target.closest("[data-place]");if(hit)showMapTooltip(hit.getAttribute("data-place"),e.clientX,e.clientY);else hideMapTooltip()});
 stage.addEventListener("pointerleave",hideMapTooltip);
 stage.addEventListener("wheel",e=>{e.preventDefault();mapZoomAt(e.clientX,e.clientY,e.deltaY<0?.82:1.22)},{passive:false});
 const pointers=new Map();let gesture=null;
 stage.addEventListener("pointerdown",e=>{
  if(e.target.closest("[data-place]")||e.target.closest("[data-cluster]"))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});stage.setPointerCapture(e.pointerId);svg.classList.add("dragging");
  if(pointers.size===1)gesture={type:"pan",x:e.clientX,y:e.clientY,view:{...mapView}};
  else if(pointers.size===2){const pts=[...pointers.values()],cx=(pts[0].x+pts[1].x)/2,cy=(pts[0].y+pts[1].y)/2;gesture={type:"pinch",distance:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y),cx,cy,anchor:svgPoint(svg,cx,cy),view:{...mapView}};}
 });
 stage.addEventListener("pointermove",e=>{
  if(!pointers.has(e.pointerId)||!gesture)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const r=stage.getBoundingClientRect();
  if(pointers.size>=2&&gesture.type==="pinch"){
   const pts=[...pointers.values()],cx=(pts[0].x+pts[1].x)/2,cy=(pts[0].y+pts[1].y)/2,dist=Math.max(8,Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y));
   const w=Math.max(500,Math.min(40000,gesture.view.w*gesture.distance/dist)),h=gesture.view.h*w/gesture.view.w,dx=(cx-gesture.cx)*gesture.view.w/r.width,dy=(cy-gesture.cy)*gesture.view.h/r.height;
   setMapView({x:gesture.anchor.x-((gesture.anchor.x-gesture.view.x)/gesture.view.w)*w-dx,y:gesture.anchor.y-((gesture.anchor.y-gesture.view.y)/gesture.view.h)*h-dy,w,h});
  }else if(pointers.size===1&&gesture.type==="pan"){
   const dx=(e.clientX-gesture.x)*gesture.view.w/r.width,dy=(e.clientY-gesture.y)*gesture.view.h/r.height;setMapView({...gesture.view,x:gesture.view.x-dx,y:gesture.view.y-dy});
  }
 });
 const stop=e=>{pointers.delete(e.pointerId);if(pointers.size===0){gesture=null;svg.classList.remove("dragging");persist()}else if(pointers.size===1){const p=[...pointers.values()][0];gesture={type:"pan",x:p.x,y:p.y,view:{...mapView}}}};
 stage.addEventListener("pointerup",stop);stage.addEventListener("pointercancel",stop);
 stage.addEventListener("click",e=>{const point=e.target.closest("[data-place]");if(point){mapSelectDetail(point.getAttribute("data-place"));return}const cluster=e.target.closest("[data-cluster]");if(cluster){const arr=mapClusterIndex[Number(cluster.getAttribute("data-cluster"))]||[];if(arr.length){const xs=arr.map(p=>p.x),ys=arr.map(p=>p.y),x=Math.min(...xs),y=Math.min(...ys),maxX=Math.max(...xs),maxY=Math.max(...ys),w=Math.max(900,maxX-x+900),h=Math.max(900,maxY-y+900);setMapView({x:x-450,y:y-450,w,h})}}});
 stage.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){const point=e.target.closest("[data-place]");if(point){e.preventDefault();mapSelectDetail(point.getAttribute("data-place"))}}});
}

"setting"><div><b>Friends groups</b><small>Requires accounts and privacy controls</small></div><span class="pill">PLANNED</span></div><div class="notice">Owner/Admin has local Raider+ preview access. This browser-only flag is not secure and does not grant a server-side subscription. No ads are served and no payments are processed. Benefits requiring cloud services are not active yet.</div></section></div></div>`;
if(page==="Settings")content=`<div class="page">${hero("PREFERENCES / DATA","Control your player hub.","Manage spoilers, export data and restore a backup.")}<div class="grid two"><section class="card"><h3>Preferences</h3><div class="setting"><div><b>Spoiler protection</b><small>Control story-sensitive notes.</small></div><select style="width:auto" onchange="db.settings.spoilers=this.value;persist()"><option value="ask" ${db.settings.spoilers==="ask"?"selected":""}>Ask first</option><option value="hide" ${db.settings.spoilers==="hide"?"selected":""}>Hide by default</option><option value="allow" ${db.settings.spoilers==="allow"?"selected":""}>Allow</option></select></div><div class="setting"><div><b>Storage</b><small>Saved in your browser.</small></div><span class="pill">LOCAL</span></div><div class="setting"><div><b>Membership</b><small>Raider+ billing not connected.</small></div><span class="admin-chip">ADMIN · RAIDER+ ACTIVE</span></div></section><section class="card"><h3>Backup / restore</h3><p>Export missions, map pins, notes, friends and preferences.</p>${button("↓ Download backup","exportBackup()","primary")}<div style="margin-top:12px"><label class="meta" for="restore">RESTORE BACKUP JSON</label><input id="restore" class="field" type="file" accept=".json,application/json" onchange="importBackup(this.files[0])"></div></section></div><section class="card" style="margin-top:12px"><h3>Reset local data</h3><p>Deletes Raider Buddy data from this browser.</p>${button("Reset profile","resetData()","danger")}</section><p class="footer">Raider Buddy is an independent fan-made companion and is not affiliated with Rockstar Games or Take-Two Interactive. Basemap attribution: Yanis v16 GTA VI Community Map via GTADB, distributed by Leonida Atlas, CC BY 4.0. Source revision 7c3f8c295d64254e6b6d269b77c6f84fc4339f9c.</p></div>`;

function addStoryEntry(kind){
 if(kind==="mission"){
  const title=prompt("Mission title (your own entry):");if(!title?.trim())return;const chapter=prompt("Chapter / mission group (optional):")||"";const notes=prompt("Notes (avoid spoilers unless you mark them):")||"";db.tasks.unshift({id:"story"+Date.now(),title:title.trim(),category:"Story",done:false,chapter,notes});
 }else{
  const title=prompt("Clue or easter egg title:");if(!title?.trim())return;const location=prompt("Location or map ID (optional):")||"Unknown";const notes=prompt("Evidence / source notes:")||"";const spoiler=confirm("Does this entry contain story spoilers?");db.easterEggs.unshift({title:title.trim(),location,notes,spoiler,found:false,status:"Unverified / player-submitted",createdAt:new Date().toISOString()});
 }
 render();
}
function toggleEgg(i){if(!db.easterEggs[i])return;db.easterEggs[i].found=!db.easterEggs[i].found;render()}
function editEgg(i){const e=db.easterEggs[i];if(!e)return;const title=prompt("Edit clue title",e.title);if(title===null)return;e.title=title.trim()||e.title;e.location=prompt("Location",e.location)||e.location;e.notes=prompt("Evidence / notes",e.notes)||e.notes;render()}
function addSessionNote(){const title=prompt("Session title (e.g. Friday evening):");if(!title?.trim())return;const text=prompt("What did you do or discover?")||"";db.notes.unshift({kind:"session",title:title.trim(),text,date:new Date().toLocaleString()});render()}
function toggleTask(id){db.tasks=db.tasks.map(t=>t.id===id?{...t,done:!t.done}:t);render()}
function addTask(){let v=document.getElementById("taskName").value.trim(),cat=document.getElementById("taskCat").value,loc=document.getElementById("taskPlace")?.value.trim()||"";if(!v)return;let m=loc.match(/\[(L\d+)\]$/),p=m?communityPlaces.find(x=>x.id===m[1]):communityPlaces.find(x=>x.id.toLowerCase()===loc.toLowerCase());db.tasks.unshift({id:"t"+Date.now(),title:v,category:cat,done:false,placeId:p?.id||null});render()}
function editTask(id){let t=db.tasks.find(x=>x.id===id);if(!t)return;let v=prompt("Edit objective",t.title);if(v===null)return;t.title=v.trim()||t.title;if(["Story","Side mission"].includes(t.category)){t.chapter=prompt("Chapter / mission group",t.chapter||"")??t.chapter;t.notes=prompt("Notes",t.notes||"")??t.notes}render()}
function removeTask(id){db.tasks=db.tasks.filter(x=>x.id!==id);render()}
function addPlace(){let name=document.getElementById("placeName").value.trim();if(!name)return;let x=Number(document.getElementById("placeX").value),y=Number(document.getElementById("placeY").value);if(!Number.isFinite(x)||!Number.isFinite(y)||x<0||x>100||y<0||y>100){alert("Enter map X and Y values from 0 to 100.");return}const gx=(MAP_BOUNDS.x+(x/100)*MAP_BOUNDS.w)/2,gy=-(MAP_BOUNDS.y+(y/100)*MAP_BOUNDS.h)/2;db.places.unshift({id:"p"+Date.now(),name,title:name,category:"personal",region:document.getElementById("placeRegion").value,evidence:document.getElementById("placeEvidence").value,gx,gy,x,y,personal:true,notes:document.getElementById("placeNotes").value.trim()||"Personal map marker."});render()}
function editPlace(id){let p=db.places.find(x=>x.id===id);if(!p)return;let n=prompt("Location notes",p.notes||"");if(n===null)return;p.notes=n;render()}
function focusPlace(id){selectedPlace=id;go("Interactive Map")}
function selectPlace(id){selectedPlace=id;let d=document.getElementById("selectedDetails");if(d)d.innerHTML=locationDetails(db.places.find(p=>p.id===id))}
function mapZoomStep(factor){const svg=document.getElementById("leonidaMap");if(!svg)return;const r=svg.getBoundingClientRect();mapZoomAt(r.left+r.width/2,r.top+r.height/2,factor)}
function fitMap(){setMapView({...MAP_START});}
function fullscreenMap(){const e=document.getElementById("mapstage");if(e?.requestFullscreen)e.requestFullscreen()}
function resetMap(){fitMap()}
function chatReply(q){q=(q||"").trim();if(!q)return;let s=q.toLowerCase(),open=db.tasks.filter(t=>!t.done),ans;if(s.includes("progress"))ans=`You have completed ${done()} of ${db.tasks.length} objectives (${pct()}%). ${open.length} remain.`;else if(s.includes("unfinished"))ans=open.map(t=>"• "+t.title).join("\n")||"Nothing left on your checklist.";else if(s.includes("next")||s.includes("plan"))ans=`Next session: start with ${open[0]?.title||"a new goal"}, save one discovery and update your progress before leaving.`;else if(s.includes("spoiler"))ans=`Your spoiler preference is "${db.settings.spoilers}". Change it in My Progress or Settings.`;else ans="I can summarise your checklist and organise your own notes. This local helper is not a generative AI model.";db.messages.push({role:"user",text:q},{role:"bot",text:ans});render()}
function clearChat(){db.messages=[];render()}
function addFriend(){let n=document.getElementById("friendName").value.trim();if(n){db.friends.push({name:n});render()}}
function removeFriend(i){db.friends.splice(i,1);render()}
function safeUrl(v){try{let u=new URL(String(v||""),location.href);return ["https:","http:"].includes(u.protocol)?u.href:""}catch{return ""}}
async function loadFeed(){let f=document.getElementById("feed");try{let r=await fetch("./entertainment.json",{cache:"no-store"});if(!r.ok)throw 0;let d=await r.json(),items=Array.isArray(d.items)?d.items:[];if(!items.length){f.innerHTML='<div class="empty">No clips or updates published yet. The site owner can add curated content to entertainment.json.</div>';return}f.innerHTML=items.map(i=>{let link=safeUrl(i.url),img=safeUrl(i.image);return `<article class="feeditem">${img?`<img class="feedimg" src="${esc(img)}" alt="" loading="lazy">`:'<div class="feedimg"></div>'}<div><div class="tag">${esc(i.type||"UPDATE")} · ${esc(i.date||"")}</div><h3>${esc(i.title||"Untitled")}</h3><p>${esc(i.description||"")}</p><div class="meta">${esc(i.source||"Raider Buddy")}</div>${link?`<a href="${esc(link)}" target="_blank" rel="noopener noreferrer">Watch / read ↗</a>`:""}</div></article>`}).join("")}catch{f.innerHTML='<div class="empty">Could not load entertainment.json. Check that the file is in the repository root.</div>'}}
function exportBackup(){let blob=new Blob([JSON.stringify({product:"Raider Buddy",version:2,exportedAt:new Date().toISOString(),data:db},null,2)],{type:"application/json"}),a=document.createElement("a"),u=URL.createObjectURL(blob);a.href=u;a.download="raider-buddy-backup.json";a.click();URL.revokeObjectURL(u)}
function importBackup(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result),v=d.data||d;if(!Array.isArray(v.tasks)||!Array.isArray(v.places))throw 0;db={...db,...v};persist();render();alert("Backup restored.")}catch{alert("Backup file is not valid.")}};r.readAsText(file)}
function resetData(){if(!confirm("Reset all local Raider Buddy data?"))return;localStorage.removeItem(STORE);db=read();layers={...layerDefaults};mapZoom=1;mapPan={x:0,y:0};render()}
render();
loadCommunityCatalogue();
</script></body></html>
