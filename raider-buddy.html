<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d12"><title>Raider Buddy — Player Hub</title><style>
:root{--bg:#080d12;--panel:#101820;--panel2:#131f28;--line:#243541;--text:#edf4f6;--muted:#90a3ad;--dim:#617783;--blue:#67baf0;--mint:#73d6b4;--amber:#e3b56e;--red:#e17b78}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{background:#0d151c;border-right:1px solid var(--line);padding:24px 15px;display:flex;flex-direction:column;min-height:100vh;position:sticky;top:0;height:100vh}.brand{display:flex;gap:11px;align-items:center;padding:4px 9px 32px}.logo{width:39px;height:39px;border-radius:12px;background:#1b2b35;border:1px solid #2b4555;display:grid;place-items:center;color:var(--blue);font-weight:900;font-size:22px}.brand b{font-size:13px;letter-spacing:.07em}.brand small{display:block;color:var(--dim);font-size:9px;letter-spacing:.12em;margin-top:4px}.navlabel{font-size:10px;letter-spacing:.15em;color:var(--dim);padding:13px 10px 8px}.nav{display:grid;gap:5px}.nav button{background:none;border:0;text-align:left;color:#9aabb4;border-radius:10px;padding:12px;display:flex;gap:12px;align-items:center;font-weight:600}.nav button.active{background:#1a2a35;color:var(--blue);box-shadow:inset 3px 0 var(--blue)}.profile{margin-top:auto;border-top:1px solid var(--line);padding:17px 8px 0;display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#203746;color:var(--blue);font-weight:800}.profile small{display:block;color:var(--dim);font-size:9px;margin-top:4px}.main{max-width:1500px;width:100%;margin:auto;padding:0 32px 60px;min-width:0}.top{height:82px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.crumb{font:10px ui-monospace,monospace;color:var(--dim);letter-spacing:.12em}.top h2{font-size:22px;margin:5px 0 0}.pill{border:1px solid #29404c;background:#11231f;color:var(--mint);padding:7px 11px;border-radius:30px;font:10px ui-monospace,monospace}.page{padding:26px 0}.heading{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:20px}.eyebrow{font:10px ui-monospace,monospace;color:var(--blue);letter-spacing:.14em}.heading h1{font-size:clamp(26px,4vw,34px);margin:8px 0 6px;letter-spacing:-.04em}.heading p,.sub{color:var(--muted);font-size:12px;line-height:1.65;margin:0}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:19px;min-width:0}.statlabel{font:10px ui-monospace,monospace;color:var(--dim);letter-spacing:.08em}.statval{font-size:27px;font-weight:800;margin:10px 0 5px}.statnote{font-size:10px;color:var(--muted)}.split{grid-template-columns:1.55fr 1fr}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.cardhead{display:flex;justify-content:space-between;gap:10px;align-items:start;margin-bottom:16px}.card h3{font-size:15px;margin:0 0 6px}.card p{color:var(--muted);font-size:11px;line-height:1.65}.btn{border:1px solid #34505f;background:#1a2d38;color:var(--text);border-radius:9px;padding:10px 13px;font-size:11px;font-weight:750}.btn.primary{background:var(--blue);border-color:var(--blue);color:#07121a}.btn.ghost{background:transparent}.btn.danger{background:#2b1a1b;border-color:#633c3b;color:#f0a09b}.btn.small{padding:7px 10px;font-size:10px}.map{height:235px;border:1px solid #2a4846;border-radius:12px;position:relative;overflow:hidden;background-color:#122c2c;background-image:linear-gradient(34deg,transparent 46%,#445e54 47%,#445e54 48%,transparent 49%),linear-gradient(110deg,transparent 46%,#40584f 47%,#40584f 48%,transparent 49%),linear-gradient(0deg,transparent 49%,#52665c 50%,#52665c 51%,transparent 52%),linear-gradient(90deg,transparent 49%,#52665c 50%,#52665c 51%,transparent 52%),radial-gradient(ellipse at 15% 22%,#26473c 0 13%,transparent 14%),radial-gradient(ellipse at 76% 70%,#27483d 0 20%,transparent 21%)}.map:after{content:'ILLUSTRATIVE CONCEPT — NOT AN OFFICIAL MAP';position:absolute;bottom:12px;left:12px;color:#b4c9bd;font:9px ui-monospace,monospace;letter-spacing:.1em}.maplabel{position:absolute;color:#d0ddd5;font:9px ui-monospace,monospace}.pin{position:absolute;width:13px;height:13px;border-radius:50%;background:var(--blue);border:3px solid white;box-shadow:0 0 0 5px #67baf033}.pin.a{top:28%;left:22%}.pin.b{top:59%;left:53%;background:var(--mint)}.pin.c{top:23%;left:81%;background:var(--amber)}.notice{border:1px solid #665334;background:#241e14;color:#e6c58d;padding:12px;border-radius:10px;font-size:11px;line-height:1.6;margin:12px 0}.list{display:grid;gap:8px}.task{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#0d161d}.task input{accent-color:var(--mint);width:17px;height:17px}.taskname{font-size:12px;font-weight:700;flex:1}.task.done .taskname{text-decoration:line-through;color:var(--dim)}.meta{font-size:10px;color:var(--dim);margin-top:4px}.field,select{width:100%;background:#0b131a;border:1px solid var(--line);border-radius:9px;padding:11px;color:var(--text);font-size:12px}.formrow{display:flex;gap:8px;margin:12px 0}.formrow .field{flex:1;min-width:0}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.filter{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:20px;padding:7px 10px;font-size:10px}.filter.active{background:#193141;border-color:#3e718e;color:var(--blue)}.places{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.place{padding:15px;background:#111c24;border:1px solid var(--line);border-radius:13px}.placeart{height:85px;border-radius:9px;margin-bottom:12px;background:linear-gradient(135deg,#244239,#152d34 45%,#9d8055 46%,#243d3c 50%,#182b36)}.placetype{font:9px ui-monospace,monospace;color:var(--mint);letter-spacing:.1em}.place h3{margin:7px 0}.place p{min-height:48px}.chat{max-width:900px}.stream{display:grid;gap:12px;max-height:430px;overflow:auto;margin:18px 0;padding:4px;min-height:220px}.msg{max-width:86%;padding:13px 15px;border-radius:12px;font-size:12px;line-height:1.7;white-space:pre-wrap}.msg.bot{background:#111e26;border:1px solid var(--line)}.msg.user{justify-self:end;background:#1b3442;border:1px solid #2b5268}.msg small{display:block;color:var(--mint);font:9px ui-monospace,monospace;margin-bottom:5px}.quick{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.quick button{border:1px solid var(--line);background:#0f1920;color:var(--muted);border-radius:18px;padding:7px 9px;font-size:10px}.setting{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:14px 0;border-bottom:1px solid var(--line)}.setting:last-child{border:0}.setting b{font-size:12px}.setting small{display:block;color:var(--muted);font-size:10px;margin-top:5px}.muted{color:var(--muted)}.footer{font-size:10px;color:var(--dim);line-height:1.7;margin-top:22px}.mobile{display:none}.empty{border:1px dashed #30414c;padding:22px;border-radius:12px;color:var(--muted);font-size:12px}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.places{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.app{display:block}.side{display:none}.main{padding:0 14px 90px}.top{height:70px}.top h2{font-size:17px}.top .pill{display:none}.page{padding:20px 0}.heading{display:block}.heading .btn{margin-top:14px}.card{padding:15px}.stats{gap:8px}.statval{font-size:23px}.two,.three{grid-template-columns:1fr}.places{grid-template-columns:1fr}.map{height:205px}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:10;background:#0d151cf5;border-top:1px solid var(--line);padding:8px 2px calc(8px + env(safe-area-inset-bottom));justify-content:space-around;backdrop-filter:blur(14px)}.mobile button{border:0;background:none;color:var(--muted);font-size:9px;display:grid;gap:4px;justify-items:center}.mobile button span{font-size:17px}.mobile button.active{color:var(--blue)}.msg{max-width:96%}}
</style></head><body><div id="app"></div><script>
const initialTasks=[{id:'t1',title:'Complete the opening story missions',category:'Story',done:false},{id:'t2',title:'Explore a new neighbourhood',category:'Exploration',done:false},{id:'t3',title:'Find and log 5 collectibles',category:'Collectibles',done:false},{id:'t4',title:'Try a side activity',category:'Activities',done:false},{id:'t5',title:'Save a favourite vehicle location',category:'Vehicles',done:false}];
const initialPlaces=[{id:'p1',name:'Ocean Drive',type:'District',area:'Vice City',description:'Iconic beachfront boulevard and neon-lit city scenery.',saved:true},{id:'p2',name:'Port area',type:'Landmark',area:'Vice City',description:'Industrial waterfront marker for your own notes.',saved:true},{id:'p3',name:'Leonida Keys',type:'Region',area:'Leonida',description:'Coastal island region to add discoveries to as you play.',saved:false},{id:'p4',name:'Downtown',type:'District',area:'Vice City',description:'Dense urban district for mission and activity notes.',saved:false},{id:'p5',name:'Grassrivers',type:'Region',area:'Leonida',description:'Wetland region concept marker; verify details in-game.',saved:false},{id:'p6',name:'Vice City Beach',type:'Activity',area:'Vice City',description:'Track beachside encounters and points of interest.',saved:false}];
const nav=[['Overview','▦'],['Discover','⌖'],['My progress','✓'],['AI companion','✧'],['Saved places','☆'],['Settings','⚙']];let section='Overview',tasks=load('rb_tasks',initialTasks),places=load('rb_places',initialPlaces),messages=load('rb_chat',[{role:'bot',text:'I’m Raider Buddy, your playthrough organiser. I can help structure goals, explain what is confirmed, and turn your own discoveries into a plan. I do not have live Rockstar data or a paid AI model connected in this free version.'}]),spoilers=load('rb_spoilers','ask'),theme=load('rb_theme','dark'),query='',filter='All';function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}function persist(){localStorage.setItem('rb_tasks',JSON.stringify(tasks));localStorage.setItem('rb_places',JSON.stringify(places));localStorage.setItem('rb_chat',JSON.stringify(messages));localStorage.setItem('rb_spoilers',JSON.stringify(spoilers));localStorage.setItem('rb_theme',JSON.stringify(theme))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function pct(){return tasks.length?Math.round(tasks.filter(x=>x.done).length/tasks.length*100):0}function saved(){return places.filter(x=>x.saved).length}function head(title,sub,eyebrow='PLAYER HUB'){return `<div class="heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${sub}</p></div></div>`}function btn(text,action,cls=''){return `<button class="btn ${cls}" onclick="${action}">${text}</button>`}
function render(){const activeId=document.activeElement?.id||'';const activeStart=document.activeElement&&'selectionStart' in document.activeElement?document.activeElement.selectionStart:null;persist();let content='';if(section==='Overview'){content=`<div class="page">${head('Welcome back, Player.','Your playthrough notes and checklist stay saved on this device.','PLAYER HUB / SINGLE-PLAYER COMPANION')}<div class="grid stats"><div class="card"><div class="statlabel">PERSONAL CHECKLIST</div><div class="statval">${pct()}%</div><div class="statnote">${tasks.filter(t=>t.done).length} of ${tasks.length} tasks completed</div></div><div class="card"><div class="statlabel">SAVED DISCOVERIES</div><div class="statval">${saved()}</div><div class="statnote">Places saved on this device</div></div><div class="card"><div class="statlabel">OPEN OBJECTIVES</div><div class="statval">${tasks.filter(t=>!t.done).length}</div><div class="statnote">Your current to-do list</div></div><div class="card"><div class="statlabel">PROFILE STATUS</div><div class="statval">LOCAL</div><div class="statnote">No account or subscription</div></div></div><div class="grid split"><section class="card"><div class="cardhead"><div><h3>Your discovery board</h3><p>A visual organiser — not an official or verified in-game map.</p></div>${btn('Open Discover →',"go('Discover')",'small')}</div><div class="map"><span class="maplabel" style="top:13%;left:7%">VICE CITY</span><span class="maplabel" style="top:48%;left:42%">DOWNTOWN</span><span class="maplabel" style="top:78%;left:77%">LEONIDA</span><i class="pin a"></i><i class="pin b"></i><i class="pin c"></i></div><p class="sub">Concept artwork only. Pins are decorative; save your own verified notes in Discover.</p></section><section class="card"><div class="cardhead"><div><h3>Playthrough coach</h3><p>Free local planning assistant</p></div><span class="pill">NO API</span></div><div class="notice">I can help organise your goals using your own checklist. I will not invent unverified missions or locations.</div><p>Suggested next step</p><b>${esc(tasks.find(t=>!t.done)?.title||'Add a new objective')}</b><div style="margin-top:16px">${btn('Ask Raider Buddy →',"go('AI companion')",'primary')}</div></section></div><section class="card" style="margin-top:15px"><div class="cardhead"><div><h3>Current objectives</h3><p>${pct()}% of your personal checklist completed</p></div>${btn('Manage progress →',"go('My progress')",'small')}</div><div class="list">${tasks.slice(0,4).map(taskHTML).join('')}</div></section></div>`}
if(section==='My progress'){content=`<div class="page">${head('Your playthrough, your pace.','Track personal objectives. Completion updates immediately.','PROGRESS TRACKER')}<div class="card"><div class="cardhead"><div><h3>Objectives</h3><p>${pct()}% complete · ${tasks.filter(t=>!t.done).length} remaining</p></div><b style="font-size:24px;color:var(--mint)">${pct()}%</b></div><div style="height:7px;background:#26343c;border-radius:10px;overflow:hidden;margin-bottom:18px"><div style="height:100%;width:${pct()}%;background:var(--mint)"></div></div><div class="formrow"><input id="taskInput" class="field" placeholder="Add your own objective…"><button class="btn primary" onclick="addTask()">＋ Add</button></div><div class="list">${tasks.map(taskHTML).join('')||'<div class="empty">No objectives yet. Add one above.</div>'}</div></div><div class="grid two" style="margin-top:15px"><div class="card"><h3>Suggested categories</h3><p>Story progression · Exploration · Collectibles · Activities · Vehicles · Challenges · Personal goals</p></div><div class="card"><h3>Your data stays yours</h3><p>Progress is stored in this browser. Download a backup before clearing browser data or switching devices.</p>${btn('Download backup','exportData()','small')}</div></div></div>`}
if(section==='Discover'){let shown=places.filter(p=>(filter==='All'||p.type===filter)&&(`${p.name} ${p.type} ${p.area} ${p.description}`).toLowerCase().includes(query.toLowerCase()));content=`<div class="page">${head('Build your own map.','Search starter place cards, save discoveries, and add your own notes. Names and descriptions are organisational prompts, not verified coordinates.','DISCOVERY DATABASE')}<div class="card"><div class="formrow"><input id="discoverSearch" class="field" placeholder="Search places, regions or types…" value="${esc(query)}" oninput="query=this.value;render()"></div><div class="filters">${['All','District','Landmark','Region','Activity','Personal'].map(x=>`<button class="filter ${filter===x?'active':''}" onclick="filter='${x}';render()">${x}</button>`).join('')}</div><div class="formrow"><input id="placeInput" class="field" placeholder="Add your own discovery…"><select id="placeArea" style="max-width:140px"><option>Vice City</option><option>Leonida</option><option>Other</option></select><button class="btn primary" onclick="addPlace()">＋ Save</button></div><div class="places">${shown.map(placeHTML).join('')||'<div class="empty">No matching discoveries.</div>'}</div></div><p class="footer">Do not treat this starter list as a verified map or exact location database.</p></div>`}
if(section==='Saved places'){content=`<div class="page">${head('Your personal discoveries.',`${saved()} saved places on this device. Add or remove locations whenever you like.`,'SAVED PLACES')}<div class="places">${places.filter(p=>p.saved).map(placeHTML).join('')||'<div class="empty">No saved places yet. Head to Discover to save one.</div>'}</div></div>`}
if(section==='AI companion'){content=`<div class="page">${head('Ask Raider Buddy.','Get practical planning help based on your own checklist and saved places.','PLAYTHROUGH COACH')}<div class="notice">Free mode uses local rules and your saved data. No live AI model is connected, and the companion will not invent unverified game facts.</div><div class="card chat"><div class="cardhead"><div><h3>Your companion</h3><p>Context: ${tasks.length} tasks · ${saved()} saved places · spoiler setting: ${spoilers}</p></div>${btn('Clear chat','clearChat()','small ghost')}</div><div class="stream" id="stream">${messages.map(m=>`<div class="msg ${m.role}"><small>${m.role==='bot'?'RAIDER BUDDY':'YOU'}</small>${esc(m.text)}</div>`).join('')}</div><div class="quick">${['What should I do next?','Plan exploration','Summarise my progress','Confirmed facts'].map(x=>`<button onclick="reply('${x}')">${x}</button>`).join('')}</div><form class="formrow" onsubmit="event.preventDefault();reply(document.getElementById('chatInput').value)"><input id="chatInput" class="field" placeholder="Ask about your plan or objectives…"><button class="btn primary">Send ↑</button></form><p class="footer">Local planning assistant, not a generative AI service. Official game information: <a style="color:var(--blue)" href="https://www.rockstargames.com/VI" target="_blank">Rockstar Games — GTA VI ↗</a></p></div></div>`}
if(section==='Settings'){content=`<div class="page">${head('Your data. Your rules.','Configure local behaviour, back up your data, or reset this browser profile.','PREFERENCES / DATA CONTROL')}<div class="grid two"><section class="card"><h3>Preferences</h3><div class="setting"><div><b>Visual theme</b><small>Choose your interface appearance.</small></div><select onchange="theme=this.value;document.body.style.filter=theme==='midnight'?'brightness(.85)':'';persist()" style="width:auto"><option value="dark" ${theme==='dark'?'selected':''}>Dark</option><option value="midnight" ${theme==='midnight'?'selected':''}>Midnight</option></select></div><div class="setting"><div><b>Spoiler handling</b><small>How planning responses handle story details.</small></div><select onchange="spoilers=this.value;persist()" style="width:auto"><option value="ask" ${spoilers==='ask'?'selected':''}>Ask first</option><option value="avoid" ${spoilers==='avoid'?'selected':''}>Avoid spoilers</option><option value="allow" ${spoilers==='allow'?'selected':''}>Allowed</option></select></div><div class="setting"><div><b>Local storage</b><small>Progress saved in this browser only.</small></div><span class="pill">ENABLED</span></div></section><section class="card"><h3>Backup & restore</h3><p>Download a JSON backup of tasks, saved places and chat. Restore it here on another device.</p>${btn('↓ Download backup','exportData()','primary')}<div style="margin-top:17px"><label class="sub">RESTORE FROM BACKUP</label><input type="file" accept="application/json,.json" class="field" onchange="importData(this.files[0])"></div><p id="backupMsg"></p></section></div><section class="card" style="margin-top:15px"><h3>Reset local profile</h3><p>This removes all Raider Buddy tasks, saved places and conversations stored in this browser.</p>${btn('Reset local data','resetData()','danger')}</section><p class="footer">Raider Buddy is an independent fan-made companion and is not affiliated with, endorsed by, or sponsored by Rockstar Games or Take-Two Interactive. No account, cloud sync, or paid AI connection is included.</p></div>`}
const title={'Overview':'Your game, in one place.','Discover':'Build your own map.','My progress':'Your playthrough, your pace.','AI companion':'A smarter way to plan.','Saved places':'Your personal discoveries.','Settings':'Your data. Your rules.'}[section];document.getElementById('app').innerHTML=`<div class="app"><aside class="side"><div class="brand"><div class="logo">R</div><div><b>RAIDER BUDDY</b><small>YOUR GAME. YOUR PROGRESS.</small></div></div><div class="navlabel">WORKSPACE</div><div class="nav">${nav.slice(0,4).map(n=>navHTML(n)).join('')}</div><div class="navlabel">YOUR ACCOUNT</div><div class="nav">${nav.slice(4).map(n=>navHTML(n)).join('')}</div><div class="profile"><div class="avatar">RB</div><div><b>Player One</b><small>LOCAL PROFILE · FREE</small></div></div></aside><main class="main"><header class="top"><div><div class="crumb">RAIDER BUDDY　/　${section.toUpperCase()}</div><h2>${title}</h2></div><span class="pill">● LOCAL MODE</span></header>${content}</main><nav class="mobile">${nav.slice(0,4).map(n=>`<button class="${section===n[0]?'active':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[0]==='My progress'?'Progress':n[0]==='AI companion'?'Buddy':n[0]}</button>`).join('')}</nav></div>`;if(section==='AI companion'){let s=document.getElementById('stream');s.scrollTop=s.scrollHeight}if(activeId){const el=document.getElementById(activeId);if(el){el.focus();if(activeStart!==null&&el.setSelectionRange)el.setSelectionRange(activeStart,activeStart)}}}
function navHTML(n){return `<button class="${section===n[0]?'active':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[0]}</button>`}function taskHTML(t){return `<div class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><div style="flex:1"><div class="taskname">${esc(t.title)}</div><div class="meta">${esc(t.category)}</div></div><button class="btn small ghost" onclick="deleteTask('${t.id}')">Remove</button></div>`}function placeHTML(p){return `<article class="place"><div class="placeart"></div><div class="placetype">${esc(p.type.toUpperCase())} · ${esc(p.area.toUpperCase())}</div><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p>${p.saved?btn('Remove from saved',`savePlace('${p.id}')`,'small'):btn('＋ Save place',`savePlace('${p.id}')`,'small primary')}</article>`}function go(s){section=s;render()}function toggleTask(id){tasks=tasks.map(t=>t.id===id?{...t,done:!t.done}:t);render()}function deleteTask(id){tasks=tasks.filter(t=>t.id!==id);render()}function addTask(){let e=document.getElementById('taskInput'),v=e.value.trim();if(!v)return;tasks.unshift({id:'x'+Date.now(),title:v,category:'Personal',done:false});render()}function addPlace(){let e=document.getElementById('placeInput'),v=e.value.trim();if(!v)return;let area=document.getElementById('placeArea').value;places.unshift({id:'x'+Date.now(),name:v,type:'Personal',area,description:'Your own discovery note. Add details as you explore.',saved:true});render()}function savePlace(id){places=places.map(p=>p.id===id?{...p,saved:!p.saved}:p);render()}function makeReply(q){let s=q.toLowerCase(),open=tasks.filter(t=>!t.done);if(s.includes('progress')||s.includes('status'))return `Your personal checklist is ${pct()}% complete. ${tasks.filter(t=>t.done).length} of ${tasks.length} tasks are done, with ${open.length} remaining. You have ${saved()} saved places.\n\nNext open tasks:\n${open.slice(0,4).map(t=>'• '+t.title).join('\n')||'Everything on your list is complete.'}`;if(s.includes('confirmed')||s.includes('official')||s.includes('fact'))return 'GTA VI is an upcoming Rockstar Games title set in the state of Leonida, with Vice City as a major location. Specific map layouts, mission lists, prices, mechanics and collectibles should be treated as unconfirmed unless Rockstar or the released game verifies them. See rockstargames.com/VI.';if(s.includes('collectible')||s.includes('location')||s.includes('where'))return `I do not have a verified collectible database or reliable coordinates. I will not make locations up. Add your own discoveries in Discover and create checklist tasks for anything you still need to find. You currently have ${saved()} saved places.`;if(s.includes('explor')||s.includes('plan')||s.includes('next'))return `A simple next-session plan:\n1. Pick one open objective: ${open[0]?.title||'create a new personal goal'}.\n2. Explore one area rather than rushing across the map.\n3. Save interesting places with a short note.\n4. Tick off completed objectives before you stop.\n\nYou currently have ${open.length} open objectives and ${saved()} saved places. ${spoilers==='avoid'?'I will keep suggestions spoiler-free.':spoilers==='ask'?'I will ask before discussing story spoilers.':'Spoilers are allowed in your settings.'}`;return `I can organise your playthrough, turn goals into a checklist, summarise your saved progress, and distinguish official facts from unknowns. Try “What should I do next?”, “Summarise my progress”, or “What is officially confirmed about GTA VI?”.`}function reply(q){q=q.trim();if(!q)return;messages.push({role:'user',text:q},{role:'bot',text:makeReply(q)});render()}function clearChat(){messages=[{role:'bot',text:'New chat started. What would you like to plan?'}];render()}function exportData(){let d={product:'Raider Buddy',version:1,exportedAt:new Date().toISOString(),tasks,places,messages,settings:{theme,spoilers}},a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.href=u;a.download='raider-buddy-backup.json';a.click();URL.revokeObjectURL(u);let m=document.getElementById('backupMsg');if(m)m.textContent='Backup downloaded.'}function importData(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.tasks)||!Array.isArray(d.places))throw 0;tasks=d.tasks;places=d.places;if(Array.isArray(d.messages))messages=d.messages;if(d.settings){spoilers=d.settings.spoilers||'ask';theme=d.settings.theme||'dark'}render();alert('Backup restored.')}catch{alert('Could not read that backup file.')}};r.readAsText(file)}function resetData(){if(confirm('Delete all local Raider Buddy data and restore the starter checklist?')){tasks=initialTasks.map(x=>({...x}));places=initialPlaces.map(x=>({...x}));messages=[{role:'bot',text:'Local profile reset. What would you like to plan?'}];spoilers='ask';theme='dark';render()}}render();
</script></body></html>
