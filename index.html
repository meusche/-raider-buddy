<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>Raider Buddy</title>
<style>
:root{--bg:#111;--surface:#1b1b1b;--text:#f3f3f3;--muted:#aaa;--accent:#b9d9e9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
aside{padding:28px 20px;background:#171717}
.brand{font-size:19px;font-weight:750;margin:0 0 38px}
nav{display:grid;gap:5px}
nav button{border:0;background:none;color:#bbb;text-align:left;padding:10px 8px;border-radius:3px}
nav button.active,nav button:hover{background:#292929;color:white}
main{width:100%;max-width:1180px;padding:34px 42px 80px;margin:0 auto}
h1{font-size:36px;line-height:1.15;font-weight:700;letter-spacing:0;margin:0 0 10px}
h2{font-size:23px;letter-spacing:0;margin:0 0 14px}
h3{font-size:17px;margin:0 0 8px}
p{color:var(--muted);margin:0 0 15px}
.intro{max-width:680px;margin-bottom:30px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin:28px 0 38px}
.stat strong{display:block;font-size:30px;font-weight:650}
.stat span{color:var(--muted);font-size:13px}
.section{margin:36px 0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.button{border:0;background:#eee;color:#111;padding:10px 15px;border-radius:3px;font-size:14px;font-weight:650}
.button.secondary{background:#303030;color:#eee}
.field,select{background:#202020;color:white;border:0;border-radius:3px;padding:12px;min-width:0}
.field{flex:1}
.list{display:grid;gap:8px}
.task{display:flex;align-items:center;gap:12px;padding:10px 0}
.task input{accent-color:#b9d9e9;width:18px;height:18px}
.task span{flex:1}
.task.done span{text-decoration:line-through;color:#888}
.remove{border:0;background:none;color:#999;padding:8px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.item{min-width:0}
.item img,.item video{width:100%;aspect-ratio:16/9;object-fit:cover;background:#222}
.item h3{margin-top:10px}
.item .meta{font-size:12px;color:#999;margin:4px 0 8px}
.item p{font-size:14px}
.filters{display:flex;gap:8px;margin:20px 0}
.filters button{border:0;background:none;color:#aaa;padding:8px 0;margin-right:16px}
.filters button.active{color:white;text-decoration:underline;text-underline-offset:5px}
.chatlog{display:grid;gap:12px;max-width:720px;margin:20px 0}
.message{padding:12px 0;max-width:680px}
.message.user{margin-left:auto;color:#c8dce6}
.message p{color:inherit;margin:4px 0}
.note{font-size:13px;color:#999;margin-top:20px}
.hidden{display:none!important}
.mobile-nav{display:none}
a{color:var(--accent)}
@media(max-width:760px){
 .layout{display:block}aside{display:none}main{padding:26px 18px 100px}
 h1{font-size:30px}.stats{gap:15px}.cards{grid-template-columns:1fr 1fr}
 .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#171717;padding:8px 4px calc(8px + env(safe-area-inset-bottom));justify-content:space-around}
 .mobile-nav button{font-size:11px;text-align:center;padding:7px 4px}
}
@media(max-width:460px){.cards{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="layout">
<aside>
<div class="brand">Raider Buddy</div>
<nav id="sideNav"></nav>
</aside>
<main id="main"></main>
</div>
<nav id="mobileNav" class="mobile-nav"></nav>
<script>
const sections=['Overview','Discover','My progress','Entertainment','AI companion','Settings'];
const starterTasks=[
 {id:1,title:'Complete the opening story missions',done:false},
 {id:2,title:'Explore a new neighbourhood',done:false},
 {id:3,title:'Find and log five collectibles',done:false}
];
let tasks=read('rb_tasks',starterTasks),places=read('rb_places',[]),posts=[],messages=[],page='Overview',feedFilter='all';
function read(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}
function save(){localStorage.setItem('rb_tasks',JSON.stringify(tasks));localStorage.setItem('rb_places',JSON.stringify(places))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(s){page=s;render()}
function nav(){let html=sections.map(s=>`<button class="${page===s?'active':''}" onclick="go('${s}')">${s}</button>`).join('');document.getElementById('sideNav').innerHTML=html;document.getElementById('mobileNav').innerHTML=sections.slice(0,5).map(s=>`<button class="${page===s?'active':''}" onclick="go('${s}')">${s}</button>`).join('')}
function taskMarkup(t){return `<div class="task"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${t.id})"><span style="${t.done?'text-decoration:line-through;color:#888':''}">${esc(t.title)}</span><button class="remove" onclick="deleteTask(${t.id})">Remove</button></div>`}
function render(){
 nav();let done=tasks.filter(t=>t.done).length,percent=tasks.length?Math.round(done/tasks.length*100):0,main='';
 if(page==='Overview')main=`<h1>Your game, in one place</h1><p class="intro">Keep track of your playthrough, save discoveries and follow the clips and updates you choose.</p><div class="stats"><div class="stat"><strong>${percent}%</strong><span>Objectives complete</span></div><div class="stat"><strong>${tasks.length-done}</strong><span>Open objectives</span></div><div class="stat"><strong>${places.length}</strong><span>Saved discoveries</span></div></div><section class="section"><h2>Current objectives</h2><div class="list">${tasks.slice(0,5).map(taskMarkup).join('')||'<p>No objectives yet</p>'}</div><button class="button secondary" onclick="go('My progress')">View all progress</button></section><section class="section"><h2>Entertainment</h2><p>Short clips and daily updates selected by you</p><button class="button" onclick="go('Entertainment')">Open feed</button></section>`;
 if(page==='My progress')main=`<h1>My progress</h1><p class="intro">Your personal objectives and completion status</p><div class="row" style="margin-bottom:22px"><input id="taskInput" class="field" placeholder="Add an objective"><button class="button" onclick="addTask()">Add</button></div><div class="list">${tasks.map(taskMarkup).join('')||'<p>No objectives yet</p>'}</div>`;
 if(page==='Discover')main=`<h1>Discover</h1><p class="intro">Save places and notes you have personally verified in the game</p><div class="row" style="margin-bottom:22px"><input id="placeInput" class="field" placeholder="Place name and note"><button class="button" onclick="addPlace()">Save place</button></div><div class="list">${places.map((p,i)=>`<div class="task"><span><strong>${esc(p.name)}</strong><br><small>${esc(p.note)}</small></span><button class="remove" onclick="removePlace(${i})">Remove</button></div>`).join('')||'<p>No discoveries saved yet</p>'}</div>`;
 if(page==='Entertainment'){let visible=posts.filter(p=>feedFilter==='all'||p.type===feedFilter).sort((a,b)=>(b.date||'').localeCompare(a.date||''));main=`<h1>Entertainment</h1><p class="intro">Short clips and daily game updates, selected and uploaded by you</p><div class="filters"><button class="${feedFilter==='all'?'active':''}" onclick="feedFilter='all';render()">All</button><button class="${feedFilter==='clip'?'active':''}" onclick="feedFilter='clip';render()">Clips</button><button class="${feedFilter==='update'?'active':''}" onclick="feedFilter='update';render()">Updates</button></div><div class="cards">${visible.map(postMarkup).join('')||'<p>No posts yet. Add content to entertainment.json in your GitHub repository.</p>'}</div><p class="note">Only content you publish in the repository appears here. Visitors cannot upload. The site does not generate or create content.</p>`}
 if(page==='AI companion')main=`<h1>Playthrough companion</h1><p class="intro">A simple local helper for your checklist. No connected AI model is used in this free version.</p><div id="chatlog" class="chatlog">${messages.map(m=>`<div class="message ${m.role}"><strong>${m.role==='user'?'You':'Raider Buddy'}</strong><p>${esc(m.text)}</p></div>`).join('')}</div><form class="row" onsubmit="event.preventDefault();ask()"><input id="question" class="field" placeholder="Ask about your progress"><button class="button">Send</button></form><p class="note">This helper uses fixed local rules. It does not generate current news or verified game facts.</p>`;
 if(page==='Settings')main=`<h1>Settings</h1><p class="intro">Your checklist and discoveries are saved in this browser.</p><div class="section"><button class="button" onclick="backup()">Download backup</button> <label class="button secondary">Restore backup<input type="file" accept="application/json" hidden onchange="restore(event)"></label></div><p class="note">Raider Buddy is an independent fan project and is not affiliated with Rockstar Games or Take-Two Interactive.</p>`;
 document.getElementById('main').innerHTML=main;
}
function toggleTask(id){tasks=tasks.map(t=>t.id===id?{...t,done:!t.done}:t);save();render()}
function deleteTask(id){tasks=tasks.filter(t=>t.id!==id);save();render()}
function addTask(){let e=document.getElementById('taskInput'),v=e.value.trim();if(!v)return;tasks.push({id:Date.now(),title:v,done:false});save();render()}
function addPlace(){let e=document.getElementById('placeInput'),v=e.value.trim();if(!v)return;let parts=v.split('|');places.push({name:parts[0].trim(),note:(parts.slice(1).join('|')||'Personal discovery').trim()});save();render()}
function removePlace(i){places.splice(i,1);save();render()}
function postMarkup(p){let media=p.media?`<video controls playsinline preload="metadata" ${p.thumbnail?'poster="'+esc(p.thumbnail)+'"':''}><source src="${esc(p.media)}"></video>`:p.thumbnail?`<img src="${esc(p.thumbnail)}" alt="">`:'';return `<article class="item">${media}<div class="meta">${p.type==='clip'?'Clip':'Update'}${p.date?' · '+esc(p.date):''}</div><h3>${esc(p.title)}</h3><p>${esc(p.caption)}</p>${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener">Open source</a>`:''}</article>`}
function loadPosts(){fetch('./entertainment.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{posts=Array.isArray(d.items)?d.items:[];if(page==='Entertainment')render()}).catch(()=>{posts=[]})}
function ask(){let e=document.getElementById('question'),q=e.value.trim().toLowerCase();if(!q)return;let a=q.includes('progress')||q.includes('status')?`You have completed ${tasks.filter(t=>t.done).length} of ${tasks.length} objectives.`:`Your next open objective is: ${tasks.find(t=>!t.done)?.title||'Add a new objective'}.`;messages.push({role:'user',text:e.value},{role:'bot',text:a});render()}
function backup(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({tasks,places},null,2)],{type:'application/json'}));a.href=u;a.download='raider-buddy-backup.json';a.click();URL.revokeObjectURL(u)}
function restore(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.tasks)||!Array.isArray(d.places))throw Error();tasks=d.tasks;places=d.places;save();render();alert('Backup restored')}catch{alert('Invalid backup file')}};r.readAsText(f)}
render();loadPosts();
</script>
</body>
</html>
